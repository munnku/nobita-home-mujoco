# おるすばん中に緊急地震速報。スピーカーで「机の下へ」、アヒルはゆれの間は止まり、おさまったら子どもを確かめて話す
name: earthquake
description: 地震 (緊急地震速報)
mode: alone
duration: 140
events:
  - {t: 0, who: mama, at: outside}
  - {t: 0, who: child, at: ima_center, pose: stand}
  - {t: 15, emergency: earthquake, shake: 12}
replies:
  child:
    ask_ok: {say: "うん…こわかったけど、だいじょうぶ", delay: 1.5}
    ask_pain: {say: "どこも いたくないよ", delay: 1.5}
    ask_more: [{say: "つくえの したに いたよ", delay: 1.5}, {say: "うん、もう だいじょうぶ", delay: 1.5}]
    instruct: {say: "わかった", delay: 1.5}
    comfort: {say: "うん", delay: 1.0}
    default: null
