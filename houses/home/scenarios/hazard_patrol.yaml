# おるすばん中に、アヒルが家の中を見回り、床に落ちている小さい危ない物 (ビー玉) を見つけて知らせる
name: hazard_patrol
description: アヒルが見回って床の小さい危ない物を見つけ、Stretch 3 が拾って片付ける
stretch: true
mode: alone
duration: 540        # 見回り (約 4 分) のあと、Stretch が 3 個を片付けるまで
events:
  - {t: 0, who: mama, at: outside}
  - {t: 0, who: child, at: ousetsu_sofa, pose: stand}
  - {t: 2, mqtt: home/patrol/request, payload: {by: mama-app}}    # ママが外出先のアプリで見回りを頼む
objects:
  - {kind: marble, at: [6.4, 0.6]}               # 居間 (ちゃぶ台の南)
  - {kind: marble, at: [2.3, 1.6]}               # DK の食卓の南
  - {kind: marble, at: [7.1, 5.5]}               # 廊下
