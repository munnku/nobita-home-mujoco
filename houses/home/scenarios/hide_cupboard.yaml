# かくれんぼ: 子どもが「かくれんぼしよう」と言い、アヒルが鬼になって 10 数える。子どもは hide_cupboard に隠れる
name: hide_cupboard
description: かくれんぼ (子どもは hide_cupboard に隠れる)
mode: alone
duration: 240
events:
  - {t: 0, who: mama, at: outside}
  - {t: 0, who: child, at: ima_center, pose: stand}
  - {t: 5, who: child, say: "ねえアヒル、かくれんぼしよう！アヒルが鬼ね！"}
  - {t: 9, who: child, at: hide_cupboard, pose: stand, walk: true, speed: 0.8}
  - {t: 22, who: child, at: hide_cupboard, pose: stand}
replies:
  child:
    hide_ready: {say: "もういいよー！", delay: 1.0}
    hide_found: {say: "あーあ、みつかっちゃった！", delay: 1.0, then: {pose: stand}}
    default: null
