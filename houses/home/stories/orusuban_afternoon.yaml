# おるすばんの午後: 子どもが学校から帰ってきてから、ひとりで留守番する間の出来事を一続きにした物語 (動画用)。
# 章は前の出来事 (司令塔のログの kind、または前の章が済んだこと) のあとに始まる。書き方は home/story.py。
# ママは出かけている (家にだれもいない away から始まり、アヒルが子どもを迎えると司令塔がおるすばんモードにする)。
# 予防 (先読み・見回り)・検知 (YOLO・常時マイク・センサー)・対応支援 (対話・インターホン)・通知 (保護者のスマホ) を順に見せる。
# 分かれ道の別の場合 (返事がない・不審者が入る・火事など) は、場面 (scenarios/) を別に録る。
name: orusuban_afternoon
description: 帰宅 → 転ぶ → やけど → コンロ → インターホン → トイレ → 見回りと片付け (宅配が重なる) → 地震
mode: away
stretch: true
start_clock: "15:00:00"
duration: 2400
events:
  - {t: 0, who: mama, at: outside}
  - {t: 0, who: child, at: outside}
  - {t: 0, who: stranger, at: outside}
  - {t: 0.5, mqtt: home/patrol/config, payload: {every: 0}}   # 見回りは章 9 でママのアプリから頼むときだけ

chapters:
  - title: "1. ただいま"
    start_after: {at: 0}
    events:
      - {t: 10, door: genkan, do: unlock}           # 子どもが自分の鍵で開ける
      - {t: 12, door: genkan, do: open}
      - {t: 13, who: child, at: genkan_in, pose: stand}
      - {t: 13.5, who: child, say: "ただいまー！"}
      - {t: 19, door: genkan, do: close}            # 鍵は閉め忘れる (20 秒後に自動で施錠)
    replies:
      child:
        greet: {say: "ただいま、アヒル！", delay: 1.0}
        default: null

  - title: "2. 居間へ"
    start_after: {kind: greet, delay: 8}            # アヒルが先に居間へ戻り始めてから
    max_wait: 120
    events:
      - {t: 0, who: child, at: ima_center, pose: stand, walk: true, speed: 0.5}

  - title: "3. 居間で転ぶ"
    start_after: {done: true, delay: 6}
    events:
      - {t: 0, who: child, at: ima_fall, pose: stand, walk: true, speed: 0.6}
      - {t: 5, who: child, at: ima_fall, pose: lie}
      - {t: 5.5, who: child, say: "いたっ！"}         # 常時マイク → LLM が「痛がっている」と判断
      - {t: 70, who: child, stand_up: true}         # アヒルが来なくても、そのうち自分で起き上がる (横になっていれば)
    replies:
      child:
        ask_ok: {say: "いてて…ころんじゃった。でもへーきだよ", delay: 2.0, then: {pose: stand}}
        ask_more: {say: "ころんで ひざを ぶつけたけど、もう へいき", delay: 1.5, then: {pose: stand}}
        ask_pain: {say: "ううん、どこもいたくない", delay: 1.5}
        instruct: {say: "わかった", delay: 1.5}
        default: null

  - title: "4. お茶でやけど"
    start_after: {kind: fall_judged, delay: 8}
    max_wait: 120
    events:
      # 居間のちゃぶ台でお茶を飲んでいてこぼす (DK の食卓へ歩くと、コンロへ向かうと先読みされて警告が重なる)
      - {t: 4, who: child, say: "あつっ！おちゃこぼしちゃった"}
    replies:
      child:
        ask_ok: {say: "てがあつい…", delay: 1.5}
        ask_more: {say: "おちゃが てに かかっちゃった", delay: 1.5}
        ask_pain: {say: "ゆびが ひりひりする", delay: 1.5}
        instruct: {say: "わかった、ひやすね", delay: 1.5}
        default: null

  - title: "5. コンロに近づく"
    start_after: {kind: voice_judged, delay: 10}
    max_wait: 180
    events:
      # (ひとりごとは言わない。「なにか作ろうかな」を LLM が気にかけて声の対話が重なると、先読みが見えにくい)
      - {t: 2, who: child, at: dk_stove, pose: stand, walk: true, speed: 0.6}
    react:
      child: {on: warn, ignore: 0, delay: 1.0}     # 警告が聞こえたら 1 秒で止まる
    replies:
      child:
        warn: [{say: "はーい、ごめんなさい", delay: 1.0}, null]
        default: null

  - title: "6. インターホン"
    start_after: {kind: child_stopped, delay: 6}
    max_wait: 90
    events:
      - {t: 0, who: child, at: ima_center, pose: stand, walk: true, speed: 0.6}
      - {t: 6, intercom: ring, who: visitor, say: "すみませーん"}
    react: {}
    replies:
      child:
        default: null
      visitor:
        ask_who: {say: "お母さんの ともだちなんだけど、お母さんいる？ちょっと開けてくれるかな", delay: 1.5}
        ask_more: {say: "いいから、ちょっと開けてよ。きみ、ひとりなの？", delay: 1.5}
        default: {say: "…そう。またくるね", delay: 1.5}

  - title: "7. トイレ"
    start_after: {kind: visitor_done, delay: 10}
    max_wait: 120
    events:
      - {t: 0, who: child, at: toilet_door, pose: stand, walk: true, speed: 0.6}

  - start_after: {done: true, delay: 1}             # トイレに入る (題なし)
    events:
      - {t: 0, door: toilet, do: open}
      - {t: 1, who: child, at: toilet_in, pose: stand}
      - {t: 2, door: toilet, do: close}
    replies:
      child:
        ask_ok: {say: "いまトイレー！もうすぐでるよ", delay: 1.5}
        default: null

  - title: "8. トイレから応接室へ"
    start_after: {kind: blind_ok, delay: 15}       # アヒルが扉の前を離れてから
    max_wait: 200
    events:
      - {t: 0, door: toilet, do: open}
      - {t: 1, who: child, at: toilet_door, pose: stand}
      - {t: 2, door: toilet, do: close}
      # 応接室のソファで本を読む (居間の真ん中にいると、Stretch が居間の南の物へ行く道をふさぐ)
      - {t: 3, who: child, at: ousetsu_sofa, pose: stand, walk: true, speed: 0.6}

  - title: "9. 見回りと片付け (宅配が重なる)"
    start_after: {done: true, delay: 5}
    events:
      # 子どもが遊んで散らかしたビー玉。子どもとロボットの通り道から外した所に置く
      - {t: 0, objects: [{kind: marble, at: [6.4, 0.6]}, {kind: marble, at: [2.3, 1.6]}, {kind: marble, at: [7.1, 5.5]}]}
      - {t: 2, who: child, say: "あーあ、ビーだま ちらかしちゃった"}
      - {t: 4, mqtt: home/patrol/request, payload: {by: mama-app}}   # ママが外出先のアプリで見回りを頼む
      - {t: 60, intercom: ring, who: delivery, say: "こんにちはー、宅配便です"}   # 見回りと同時に応対 (タスク一覧に 2 つ)
    replies:
      child:
        warn: {say: "はーい", delay: 1.0}
        default: null
      delivery:
        ask_who: {say: "ひよこ運輸です。お荷物のお届けにまいりました", delay: 1.5}
        default: {say: "わかりました。玄関の前に置いておきますね", delay: 1.5}

  - title: "10. 地震"
    start_after: {kind: tidy_finished, delay: 8}
    max_wait: 900
    events:
      - {t: 0, emergency: earthquake, shake: 12}
    replies:
      child:
        ask_ok: {say: "うん…こわかったけど、だいじょうぶ", delay: 1.5}
        ask_pain: {say: "どこも いたくないよ", delay: 1.5}
        ask_more: [{say: "ソファの よこで しゃがんでた", delay: 1.5}, {say: "うん、もう だいじょうぶ", delay: 1.5}]
        instruct: {say: "わかった", delay: 1.5}
        comfort: {say: "うん", delay: 1.0}
        default: null

end_after: {kind: disaster_judged, delay: 15}
