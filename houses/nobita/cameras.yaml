# のび太君の家の IoT カメラ (見守りカメラ)。天井近くの角から部屋を見下ろす。
# pos / look_at: [x, y, z]。x y は layout.yaml と同じマス (0.91 m)、z は m (2 階の床は 2.7 m)
# 浴室・洗面・トイレにはカメラを置かない (人感センサーだけ)
width: 640
height: 480
fovy: 70
rate: 2.0        # 撮る回数 [回/秒]
cameras:
  - {name: cam_ima, room: ima, pos: [8.85, 0.15, 2.3], look_at: [5.8, 2.6, 0.4]}         # 居間 (南東の角から北西)
  - {name: cam_ousetsu, room: ousetsu, pos: [11.85, 3.85, 2.3], look_at: [10.2, 1.2, 0.4]}  # 応接室 (北東の角から南西)
  - {name: cam_dk, room: dk, pos: [3.85, 5.85, 2.3], look_at: [1.8, 2.5, 0.4]}           # DK (北東の角から南西)
  - {name: cam_rouka, room: rouka, pos: [11.85, 5.85, 2.3], look_at: [6.5, 4.8, 0.3]}    # 廊下と玄関 (玄関の上から西)
  - {name: cam_nobita, room: nobita, pos: [5.15, 1.15, 5.0], look_at: [7.5, 2.8, 3.0]}   # のび太の部屋 (南西の角から北東)
