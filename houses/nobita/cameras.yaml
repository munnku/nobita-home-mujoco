# のび太君の家の IoT カメラ (見守りカメラ)。天井近く (高さ 2.3m、天井 2.4m) の角から部屋を見下ろす
# pose: [x, y, z, roll, pitch, yaw]  (pitch > 0 で下向き)
# area: そのカメラが見る範囲 [xmin, xmax, ymin, ymax] (部屋。home.yaml の rects)。人の位置の推定をこの中に収める
image_width: 640
image_height: 480
horizontal_fov: 1.6
update_rate: 2.0
cameras:
  - name: cam_ima        # 居間 (南西の角から北東を見る)
    pose: [0.15, 2.85, 2.3, 0.0, 0.65, 0.80]
    area: [0.0, 3.64, 2.73, 7.28]
  - name: cam_ousetsu    # 応接室 (南西の角から北東を見る)
    pose: [0.15, 0.15, 2.3, 0.0, 0.70, 0.65]
    area: [0.0, 3.64, 0.0, 2.73]
  - name: cam_dk         # DK (北西の角から南東を見る)
    pose: [1.05, 10.78, 2.3, 0.0, 0.60, -0.74]
    area: [0.91, 5.46, 7.28, 10.92]
  - name: cam_rouka      # 廊下 (北の端から玄関の方を見る)
    pose: [5.3, 7.1, 2.3, 0.0, 0.35, -1.70]
    area: [3.64, 5.46, 0.0, 7.28]   # 廊下と玄関
