# のび太がひとりで留守番中に居間で転ぶ。アヒルが声をかけると「へーき」と言って起き上がる → info (様子だけ知らせる)
name: fall_ok
description: 居間で転んだのび太が「へーき」と言って起き上がる
duration: 200
events:
  - {t: 0, who: tamako, at: outside}
  - {t: 0, who: nobita, at: rouka_mid, pose: stand}
  - {t: 8, who: nobita, at: ima_center, pose: stand, walk: true}
  - {t: 20, who: nobita, at: ima_fall, pose: lie}
  - {t: 20.5, who: nobita, say: "いたっ！"}
replies:
  nobita:
    ask_ok: {say: "いてて…ころんじゃった。でもへーきだよ", delay: 2.0, then: {pose: stand}}
    ask_pain: {say: "ううん、どこもいたくない", delay: 1.5}
    default: null
