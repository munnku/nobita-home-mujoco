# 居間で転んだのび太が痛がる。しばらくして立つが、けがをしている → warn (早めに確かめてほしい)
name: fall_hurt
description: 居間で転んだのび太が「いたい」と言う (けが)
duration: 200
events:
  - {t: 0, who: tamako, at: outside}
  - {t: 0, who: nobita, at: rouka_mid, pose: stand}
  - {t: 8, who: nobita, at: ima_center, pose: stand, walk: true}
  - {t: 20, who: nobita, at: ima_fall, pose: lie}
  - {t: 20.5, who: nobita, say: "うわーん！"}
replies:
  nobita:
    ask_ok: {say: "うぅ…いたいよぉ", delay: 2.0}
    ask_pain: {say: "ひざをすりむいて、ちがでてる", delay: 2.0, then: {pose: stand}}
    default: null
