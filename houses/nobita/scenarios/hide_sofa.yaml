# かくれんぼ: のび太が「かくれんぼしよう」と言い、アヒルが鬼になって 10 数える。のび太は hide_sofa に隠れる
name: hide_sofa
description: かくれんぼ (のび太は hide_sofa に隠れる)
mode: alone
duration: 240
events:
  - {t: 0, who: tamako, at: outside}
  - {t: 0, who: nobita, at: ima_center, pose: stand}
  - {t: 5, who: nobita, say: "ねえアヒル、かくれんぼしよう！アヒルが鬼ね！"}
  - {t: 9, who: nobita, at: hide_sofa, pose: stand, walk: true, speed: 0.8}
  - {t: 22, who: nobita, at: hide_sofa, pose: lie}
replies:
  nobita:
    hide_ready: {say: "もういいよー！", delay: 1.0}
    hide_found: {say: "あーあ、みつかっちゃった！", delay: 1.0, then: {pose: stand}}
    default: null
